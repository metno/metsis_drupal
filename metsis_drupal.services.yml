services:
  _defaults:
    autowire: true
    autoconfigure: true

  logger.channel.metsis_drupal:
    parent: logger.channel_base
    arguments: ["metsis"]

  Drupal\metsis_drupal\Hook\HoneypotHooks:
    arguments:
      - "@honeypot"

  metsis_drupal.search_api_subscriber:
    class: Drupal\metsis_drupal\EventSubscriber\SearchApiSubscriber
    arguments: []
    tags:
      - { name: event_subscriber }

  metsis_drupal.search_api_solr_subscriber:
    class: Drupal\metsis_drupal\EventSubscriber\SearchApiSolrSubscriber
    arguments:
      - "@metsis_drupal.config_provider"
      - "@metsis_drupal.metsis_helper"
      - "@logger.factory"
    tags:
      - { name: event_subscriber }

  metsis_drupal.solarium_request_timing_subscriber:
    class: Drupal\metsis_drupal\EventSubscriber\SolariumRequestTimingSubscriber
    arguments:
      - "@logger.factory"
    tags:
      - { name: event_subscriber }

  metsis_drupal.metsis_search_ajax_subscriber:
    class: Drupal\metsis_drupal\EventSubscriber\ViewsAjaxResponseSubscriber
    arguments: []
    tags:
      - { name: event_subscriber }

  metsis_drupal.bokeh_plot_service:
    class: Drupal\metsis_drupal\Service\BokehPlotService
    arguments:
      - "@http_client"
      - "@config.factory"

  metsis_drupal.feature_type_lookup_service:
    class: Drupal\metsis_drupal\Service\FeatureTypeLookupService
    arguments:
      - "@http_client"
      - "@config.factory"

  # --- Tier 1: Infrastructure Services (minimal deps, no UI deps) -----------

  metsis_drupal.solr_connector_provider:
    class: Drupal\metsis_drupal\Service\SolrConnectorProvider
    arguments:
      - "@entity_type.manager"

  metsis_drupal.solr_query_factory:
    class: Drupal\metsis_drupal\Service\SolrQueryFactory
    arguments:
      - "@metsis_drupal.solr_connector_provider"

  metsis_drupal.solr_document_loader:
    class: Drupal\metsis_drupal\Service\SolrDocumentLoader
    arguments:
      - "@metsis_drupal.solr_query_factory"
      - "@metsis_drupal.solr_connector_provider"

  metsis_drupal.metadata_document_normalizer:
    class: Drupal\metsis_drupal\Service\MetadataDocumentNormalizer

  metsis_drupal.catalog_button_builder:
    class: Drupal\metsis_drupal\Service\CatalogButtonBuilder

  Drupal\metsis_drupal\Service\CatalogButtonBuilder:
    alias: "metsis_drupal.catalog_button_builder"

  metsis_drupal.dataset_visualisation_builder:
    class: Drupal\metsis_drupal\Service\DatasetVisualisationBuilder
    arguments:
      - "@string_translation"
      - "@url_generator"

  Drupal\metsis_drupal\Service\DatasetVisualisationBuilder:
    alias: "metsis_drupal.dataset_visualisation_builder"

  metsis_drupal.markdown_detector:
    class: Drupal\metsis_drupal\Service\MarkdownDetector

  # Alias for autowiring.
  Drupal\metsis_drupal\Service\SolrConnectorProvider:
    alias: "metsis_drupal.solr_connector_provider"

  Drupal\metsis_drupal\Service\SolrQueryFactory:
    alias: "metsis_drupal.solr_query_factory"

  Drupal\metsis_drupal\Service\SolrDocumentLoader:
    alias: "metsis_drupal.solr_document_loader"

  Drupal\metsis_drupal\Service\MetadataDocumentNormalizer:
    alias: "metsis_drupal.metadata_document_normalizer"

  Drupal\metsis_drupal\Service\MarkdownDetectorInterface:
    alias: "metsis_drupal.markdown_detector"

  # --- Tier 2: Configuration & Domain Services -------------------------------

  metsis_drupal.config_provider:
    class: Drupal\metsis_drupal\Service\ConfigProvider
    arguments:
      - "@config.factory"

  Drupal\metsis_drupal\Service\ConfigProvider:
    alias: "metsis_drupal.config_provider"

  # --- Tier 3: UI/Rendering Services ----------------------------------------

  metsis_drupal.leaflet_map_renderer:
    class: Drupal\metsis_drupal\Service\LeafletMapRenderer
    arguments:
      - "@leaflet.service"
      - "@renderer"

  Drupal\metsis_drupal\Service\LeafletMapRenderer:
    alias: "metsis_drupal.leaflet_map_renderer"

  # --- Tier 4: High-level Search Helpers ------------------------------------

  metsis_drupal.metsis_helper:
    class: Drupal\metsis_drupal\Utility\MetsisHelper
    arguments:
      - "@module_handler"
      - "@metsis_drupal.config_provider"
      - "@metsis_drupal.feature_type_lookup_service"
      - "@metsis_drupal.met_vocab_service"
      - "@metsis_drupal.solr_connector_provider"

  metsis_drupal.status_report_service:
    class: Drupal\metsis_drupal\Service\StatusReportService
    arguments:
      - "@entity_type.manager"
      - "@module_handler"
      - "@config.factory"

  # Alias the FQCN to the service id so type-hinted injections (autowire)
  # resolve to the defined service instead of attempting a no-arg instantiation.
  Drupal\metsis_drupal\Utility\MetsisHelper:
    alias: "metsis_drupal.metsis_helper"

  metsis_drupal.result_row_renderer:
    class: Drupal\metsis_drupal\Service\ResultRowRenderer
    arguments:
      [
        "@metsis_drupal.metsis_helper",
        "@module_handler",
        "@metsis_drupal.config_provider",
        "@metsis_drupal.leaflet_map_renderer",
        "@metsis_drupal.met_vocab_service",
        "@metsis_drupal.markdown_detector",
      ]

  metsis_drupal.metadata_document_controller:
    class: Drupal\metsis_drupal\Controller\MetadataDocumentController
    arguments:
      - "@metsis_drupal.metadata_document_normalizer"
      - "@metsis_drupal.result_row_renderer"

  Drupal\metsis_drupal\Controller\MetadataDocumentController:
    alias: "metsis_drupal.metadata_document_controller"

  metsis_drupal.metadata_export_service:
    class: Drupal\metsis_drupal\Service\MetadataExportService
    arguments:
      - "@config.factory"
      - "@entity_type.manager"

  Drupal\metsis_drupal\Service\MetadataExportService:
    alias: "metsis_drupal.metadata_export_service"

  # --- Met vocabulary service -------------------------------------------------

  # Dedicated cache bin for the parsed MMD vocabulary index (24 h TTL).
  cache.metsis_vocab:
    class: Drupal\Core\Cache\CacheBackendInterface
    factory: ["@cache_factory", "get"]
    tags:
      - { name: cache.bin }

    arguments: ["metsis_vocab"]

  metsis_drupal.met_vocab_service:
    class: Drupal\metsis_drupal\Service\MetVocabService
    arguments:
      - "@config.factory"
      - "@cache.metsis_vocab"
      - "@datetime.time"

  # Alias the interface so type-hinted injections resolve to this service.
  Drupal\metsis_drupal\Service\MetVocabServiceInterface:
    alias: "metsis_drupal.met_vocab_service"

  # Cron hook class — explicit registration needed for constructor DI.
  metsis_drupal.cron_hook:
    class: Drupal\metsis_drupal\Hook\CronHook
    arguments:
      - "@metsis_drupal.met_vocab_service"
