"$schema": "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"
name: Data center
status: stable
group: metsis
description: A normalized data-center name, optional abbreviation, and accessible resource link.
props:
  type: object
  properties:
    name:
      type: string
      title: Primary name
      default: ""
      examples:
        - Norwegian Meteorological Institute
    short_name:
      type: string
      title: Distinct abbreviation
      default: ""
      examples:
        - METNO
    resource_url:
      type: string
      title: Validated HTTP(S) resource URL
      default: ""
      examples:
        - https://www.met.no/
