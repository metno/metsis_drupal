name: Quality and Tests

on:
  push:
  pull_request:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint
        run: npx eslint .

  prettier-check:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Prettier check
        run: npx prettier --check .

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare Drupal project
        uses: ./.github/actions/drupal-prepare
        with:
          site-name: metsis_drupal
          project-paths: modules/custom
          ensure-themes-custom: "true"
          ensure-profiles-custom: "true"

      - name: Run PHPStan
        run: |
          cd $GITHUB_WORKSPACE
          vendor/bin/phpstan analyse --configuration=phpstan.neon

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare Drupal project
        uses: ./.github/actions/drupal-prepare
        with:
          site-name: metsis_drupal
          project-paths: modules/custom
          ensure-themes-custom: "true"
          ensure-profiles-custom: "true"

      - name: Run PHPCS
        run: |
          cd $GITHUB_WORKSPACE
          vendor/bin/phpcs -s --report-full --report-summary

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2

      - name: Prepare Drupal project
        uses: ./.github/actions/drupal-prepare
        with:
          site-name: metsis_drupal
          project-paths: modules/custom
          ensure-themes-custom: "true"
          ensure-profiles-custom: "false"
          provision-mmd: "true"

      - name: Prepare PHPUnit config
        run: |
          sed "s|/var/www/html|$GITHUB_WORKSPACE|g" "$GITHUB_WORKSPACE/phpunit.xml" > "$GITHUB_WORKSPACE/phpunit.ci.xml"
          cd $GITHUB_WORKSPACE

      - name: Setup Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Run PHPUnit
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
          SIMPLETEST_BASE_URL: http://127.0.0.1:8888
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p .artifacts web/sites/default/files web/sites/simpletest/browser_output
          export SIMPLETEST_DB="sqlite://localhost/$GITHUB_WORKSPACE/web/sites/default/files/simpletest.sqlite"
          export MINK_DRIVER_ARGS_WEBDRIVER="$(jq -cn --arg binary "$CHROME_PATH" \
            '["chrome", {"goog:chromeOptions": {"w3c": true, "binary": $binary, "args": ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--window-size=1440,1200", "--enable-unsafe-swiftshader"]}}, "http://127.0.0.1:4444"]')"

          (
            cd "$GITHUB_WORKSPACE/web"
            PHP_CLI_SERVER_WORKERS=4 exec php -S 127.0.0.1:8888 \
              -t "$GITHUB_WORKSPACE/web" "$GITHUB_WORKSPACE/web/.ht.router.php"
          ) > .artifacts/php-server.log 2>&1 &
          server_pid=$!
          "$CHROMEDRIVER_PATH" --port=4444 --allowed-ips=127.0.0.1 > .artifacts/chromedriver.log 2>&1 &
          driver_pid=$!
          trap 'kill "$driver_pid" "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4444/status | jq -e '.value.ready == true' >/dev/null \
              && curl --fail --silent --max-time 2 http://127.0.0.1:8888/core/misc/drupal.js >/dev/null; then
              ready=true
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            cat .artifacts/chromedriver.log .artifacts/php-server.log
            echo "::error::ChromeDriver or Drupal HTTP server failed to become ready."
            exit 1
          fi

          vendor/bin/phpunit --configuration="$GITHUB_WORKSPACE/phpunit.ci.xml"

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-browser-diagnostics
          path: |
            .artifacts/
            web/sites/simpletest/browser_output/
