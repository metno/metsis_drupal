views.display_extender.metsis_layout:
  type: views_display_extender
  label: "METSIS layout"
  mapping: {}

views.field.leaflet_geometry_field:
  type: views_field
  label: "Location Lat/Lon search field"
  mapping:
    link_to_item:
      type: boolean
      label: "Link to item"
    use_highlighting:
      type: boolean
      label: "Use highlighted field data"
    display_as_leaflet:
      type: boolean
      label: "Display as Leaflet map"

views.area.metsis_map:
  type: views_area
  label: "Placeholder for Metsis search map"
  mapping:
    map_app_settings:
      type: string
      label: "Map App Settings"
    map_height:
      type: integer
      label: "Map height in pixels"
      constraints:
        Range:
          min: 150
          max: 1000
    show_all_wms:
      type: boolean
      label: "Show all WMS products control"

views.filter.metsis_filter_date_range:
  type: views_filter
  label: "Solr DateRange filter"
  mapping:
    operator:
      type: string
      label: "Operator"
    value:
      type: mapping
      label: "Date Range"
      mapping:
        min:
          type: string
          label: "Start Date"
        max:
          type: string
          label: "End Date"
        type:
          type: string
          label: "Date offset type"
    expose:
      type: mapping
      label: "Expose settings"
      mapping:
        identifier:
          type: string
          label: "Expose identifier"
        date_format:
          type: string
          label: "Date format"
        placeholder:
          type: string
          label: "Placeholder date"
        min_placeholder:
          type: string
          label: "Placeholder start date"
        max_placeholder:
          type: string
          label: "Placeholder end date"

views.filter.metsis_filter_bbox:
  type: views_filter
  label: "Solr Bbox filter"
  mapping:
    operator:
      type: string
      label: "Operator"
    value:
      type: mapping
      label: "Coordinates"
      mapping:
        minX:
          type: string
          label: "minX"
        maxX:
          type: string
          label: "maxX"
        minY:
          type: string
          label: "minY"
        maxY:
          type: string
          label: "maxY"
    expose:
      type: mapping
      label: "Expose settings"
      mapping:
        identifier:
          type: string
          label: "Expose identifier"
        map_input:
          type: integer
          label: "Use OL Map as input widget"
        user_input:
          type: integer
          label: "Provide manual coordinate input fields alongside map"
        tabs_component:
          type: integer
          label: "Render map and coordinate inputs in tabs"
        map_height:
          type: integer
          label: "Map height in pixels"
          constraints:
            Range:
              min: 150
              max: 1000

views.row.metsis_search_row:
  type: mapping
  label: 'Metsis Search Row Plugin'
  description: 'Configuration schema for the custom Metsis search row plugin.'
  mapping:
    show_operations:
      type: boolean
      label: 'Show Operations'
      description: 'Whether to show operations for each row.'
    style:
      type: string
      label: 'Style'
      description: 'The style to apply to the row.'
      constraints:
        Choice:
          choices:
            - default
            - custom
            - compact
            - detailed
            - nbs
    custom_style_name:
      type: string
      label: 'Custom row style machine name'
    component_icon_width:
      type: integer
      label: 'Collection and license icon width'
    doi_show_identifier:
      type: boolean
      label: 'Show DOI identifier'
    doi_icon_size:
      type: integer
      label: 'DOI icon size'
    doi_logo_color:
      type: boolean
      label: 'Use original DOI logo colors'
    temporal_extent_short_notation:
      type: boolean
      label: 'Temporal extent short notation'
    temporal_extent_compact_labels:
      type: boolean
      label: 'Temporal extent compact labels'
    temporal_extent_add_icon:
      type: boolean
      label: 'Show temporal extent icon'
    temporal_extent_icon_id:
      type: string
      label: 'Temporal extent icon ID'
    thumbnail_link_to_wms:
      type: boolean
      label: 'Link thumbnails to WMS visualisation'
    datacenter_name_fallback:
      type: string
      label: 'Datacenter Name Fallback'
      description: 'Fallback value for the datacenter name.'
    project_name_fallback:
      type: string
      label: 'Project Name Fallback'
      description: 'Fallback value for the project name.'
    platform_name_fallback:
      type: string
      label: 'Platform Name Fallback'
      description: 'Fallback value for the platform name.'
    platform_instrument_name_fallback:
      type: string
      label: 'Platform Instrument Name Fallback'
      description: 'Fallback value for the platform instrument name.'
    extra_detailed_config:
      type: mapping
      label: 'Extra Detailed Config'
      description: 'Extra detailed configuration for the row plugin.'
      mapping:
        key1:
          type: string
          label: 'Key 1'
          description: 'A custom key for extra configuration.'
        key2:
          type: integer
          label: 'Key 2'
          description: 'A custom integer for extra configuration.'
    view_modes:
      type: sequence
      label: 'View Modes'
      description: 'A list of view modes for the row plugin.'
      sequence:
        type: string
        label: 'View Mode'
